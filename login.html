<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="src/pages/css/styles.css">
</head>
<body class="login_body">
    <container class="login_title">
        <h1>AdminOps</h1>
        <h3>Management Dashboard</h3>
    </container>
    <container class="login_input">
        <div class= "login_input-email">
            <h3>Email address</h3>
            <input type="text" class="login-name" id="login-name" name="login name">
        </div>       
        <div class="login_input-password">
            <h3>Password</h3>
                <input type="text" class="login-password" id="login-password" name="login password">
        </div>
        <div class="login_input-btn">
            <button>Sign in →</button>
        </div>
    </container>
    
</body>
</html>
